services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vonk
      POSTGRES_USER: vonk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vonk}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vonk"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: ./.env
    environment:
      DATABASE_URL: postgresql+asyncpg://vonk:${POSTGRES_PASSWORD:-vonk}@postgres:5432/vonk
      REDIS_URL: redis://redis:6379/0
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      CORS_ORIGINS: http://localhost:3000
      PYTHONUNBUFFERED: "1"
    ports:
      - "8002:8000"
    volumes:
      - ./backend:/app
      - ./scripts:/app/scripts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
    depends_on:
      - backend

  mcp:
    build: ./mcp_server
    ports:
      - "8001:8001"
    environment:
      VONK_API: http://backend:8000
      FASTMCP_HOST: 0.0.0.0
      FASTMCP_PORT: "8001"
    depends_on:
      - backend

volumes:
  postgres_data:
